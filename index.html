<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAYA — İlaç Hafıza & Bilgi</title>
    <meta name="description" content="Akıllı ilaç danışmanı. Dozaj, yan etki, hamilelik, etkileşim, semptom analizi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <div class="header-inner">
          <div class="logo">
            <span class="logo-icon">◇</span>
            <h1 class="logo-text">MAYA</h1>
            <span class="logo-tagline">İlaç Hafıza & Bilgi</span>
          </div>
          
          <!-- Quick Buttons -->
          <div class="quick-actions">
            <button class="quick-btn" data-action="sık-kullanılan">⭐ Sık Kullanılan</button>
            <button class="quick-btn" data-action="kategoriler">📂 Kategoriler</button>
            <button class="quick-btn" data-action="ayarlar">⚙️ Ayarlar</button>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Chat Area -->
        <div class="conversation" id="conversation"></div>

        <!-- Sidebar (Hidden by default on mobile) -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h3>İlaç Kategorileri</h3>
            <button class="close-sidebar" id="close-sidebar">✕</button>
          </div>
          <div class="sidebar-content" id="sidebar-content"></div>
        </aside>
      </main>

      <!-- Input Section -->
      <section class="single-bar" id="single-bar">
        <div class="bar-inner">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="main-input" 
              class="main-input" 
              placeholder="İlaç adı, semptom veya soru yazın..." 
              autocomplete="off" 
            />
            <button type="button" class="input-clear" id="input-clear" style="display: none;">✕</button>
          </div>
          <button type="button" id="main-send" class="btn btn-primary btn-send">Gönder</button>
          <button type="button" id="sidebar-toggle" class="btn btn-secondary">☰</button>
        </div>

        <!-- Suggestion Pills -->
        <div class="suggestions" id="suggestions"></div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p>⚕️ MAYA — Eczane ve ilaç bilgisi rehberin. Bilgiler genel bilgi amaçlıdır; tedavi için mutlaka doktor veya eczacıya danışın.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
